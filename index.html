<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi Agenda</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%232A62AE'/%3E%3Cg transform='translate(0 2)'%3E%3Cpath d='M9 13C14 11 18 12 20 14V30C18 28 14 27 9 29Z' fill='%23fff'/%3E%3Cpath d='M31 13C26 11 22 12 20 14V30C22 28 26 27 31 29Z' fill='%23A9CBF7'/%3E%3Ccircle cx='20' cy='8' r='2.2' fill='%23fff'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..650&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: dark navigation rail (brand, views, summary, subject legend) beside a light workspace. On phones the rail collapses to a sticky top bar. */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface-2:#F5F7FA; --line:#D9DFE7;
  --fg:#101A25; --muted:#586677; --accent:#1B4F8F; --accent-fg:#FFFFFF;
  --accent-soft:#DCE8F7; --danger:#B3382F; --ok:#1D7A4E; --focus:#1B4F8F; --scrim:rgba(10,18,28,.55);
  --side-bg:#0F2540; --side-fg:#E8EEF6; --side-muted:#9DB0C6; --side-line:#223B5A;
  --side-hover:rgba(255,255,255,.07); --side-active:rgba(255,255,255,.14);
  --f-display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --f-body:'Instrument Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --radius:6px; --radius-lg:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D131A; --surface:#151D27; --surface-2:#1B2530; --line:#2B3846;
    --fg:#E7EDF3; --muted:#95A3B3; --accent:#7FB0F0; --accent-fg:#0A1522;
    --accent-soft:#1B2F49; --danger:#F18C84; --ok:#6FD3A0; --focus:#7FB0F0; --scrim:rgba(0,0,0,.62);
    --side-bg:#101923; --side-line:#223040; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D131A; --surface:#151D27; --surface-2:#1B2530; --line:#2B3846;
  --fg:#E7EDF3; --muted:#95A3B3; --accent:#7FB0F0; --accent-fg:#0A1522;
  --accent-soft:#1B2F49; --danger:#F18C84; --ok:#6FD3A0; --focus:#7FB0F0; --scrim:rgba(0,0,0,.62);
  --side-bg:#101923; --side-line:#223040; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* Shell */
.app{display:grid;grid-template-columns:284px minmax(0,1fr);align-items:start}
.side{background:var(--side-bg);color:var(--side-fg);position:sticky;top:0;height:100vh;overflow-y:auto;padding:24px 18px;display:flex;flex-direction:column;gap:22px;border-right:1px solid var(--side-line);min-width:0}
.main{min-width:0;padding:30px 32px 56px;max-width:1320px}
.only-narrow{display:none!important}
@media (max-width:899px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;z-index:8;height:auto;flex-direction:row;align-items:center;justify-content:space-between;padding:10px 16px;gap:12px;overflow:visible;border-right:0;border-bottom:1px solid var(--side-line)}
  .only-wide{display:none!important}
  .only-narrow{display:flex!important}
  .main{padding:18px 16px 48px}
}

/* Brand */
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand-mark{width:40px;height:40px;flex:none;display:block}
.brand-name{display:block;font-family:var(--f-display);font-weight:720;font-size:21px;letter-spacing:-.015em;line-height:1.1}
.brand-tag{display:block;font-size:12px;color:var(--side-muted);letter-spacing:.02em}
.side .add-btn{background:#F3F7FD;color:#0F2540;border-color:#F3F7FD;font-weight:650}
.side .add-btn:hover{filter:none;background:#fff}
@media (min-width:900px){.side .add-btn{width:100%;min-height:40px}}

/* Rail sections */
.rail-title{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--side-muted);font-weight:650;margin:0 0 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.rail-title button{background:none;border:0;color:var(--side-muted);font-size:12px;letter-spacing:0;text-transform:none;font-weight:550;cursor:pointer;padding:2px 4px;border-radius:4px}
.rail-title button:hover{color:var(--side-fg);background:var(--side-hover)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--side-fg);padding:9px 10px;border-radius:var(--radius);cursor:pointer;font-weight:550;text-align:left}
.nav button:hover{background:var(--side-hover)}
.nav button[aria-current="page"]{background:var(--side-active)}
.nav svg{flex:none;opacity:.85}
.sum{display:grid;gap:1px;border-radius:var(--radius);overflow:hidden;background:var(--side-line)}
.sum div{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 10px;background:color-mix(in srgb,var(--side-bg) 90%,#fff);font-size:14px}
.sum b{font-family:var(--f-mono);font-weight:500;font-size:16px;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-direction:column;gap:2px}
.lg{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--side-fg);padding:7px 10px;border-radius:var(--radius);cursor:pointer;text-align:left;min-width:0;font-size:14px}
.lg:hover{background:var(--side-hover)}
.lg[aria-pressed="true"]{background:var(--side-active)}
.lg .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg .cnt{font-family:var(--f-mono);font-size:12px;color:var(--side-muted)}
.lg-dot{width:11px;height:11px;border-radius:3px;background:var(--c);flex:none}
.rail-note{color:var(--side-muted);font-size:13px;margin:0}

/* Page head */
.page-head{margin-bottom:16px}
.eyebrow{margin:0 0 4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:650}
h1{font-family:var(--f-display);font-weight:720;font-size:clamp(25px,4.5vw,34px);letter-spacing:-.02em;line-height:1.1;margin:0}

/* Toolbar */
.toolbar{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:10px 12px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:20px}
.tb-group{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0}
.tb-filters{margin-left:auto}
@media (max-width:899px){.tb-filters{margin-left:0;width:100%}.tb-filters .sel{flex:1 1 140px}}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:2px;gap:2px;max-width:100%}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:4px;cursor:pointer;font-weight:550;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:var(--radius);cursor:pointer;font-weight:550;font-size:14px;min-height:36px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.btn.icon{padding:7px 9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.sel,.inp{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:7px 10px;min-height:36px;max-width:100%}
.sel{padding-right:6px}
.lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:650}

/* Empty state */
.empty{padding:40px 16px;border:1px dashed var(--line);border-radius:var(--radius-lg);text-align:center;color:var(--muted);background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:6px}
.empty strong{color:var(--fg);font-family:var(--f-display);font-size:20px}
.empty .btn{margin-top:10px}
.inline-empty{color:var(--muted);margin:0 0 14px}
.past-toggle{margin-bottom:14px}

/* List view: one card per date */
.day{display:grid;grid-template-columns:150px minmax(0,1fr);gap:0 18px;padding:16px 18px;margin-bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg)}
.day.is-today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day-head{display:flex;flex-direction:column;gap:1px;align-items:flex-start;min-width:0;padding-right:16px;border-right:1px solid var(--line)}
.dow{font-family:var(--f-display);font-weight:680;font-size:18px;line-height:1.15}
.dnum{font-family:var(--f-mono);font-size:34px;font-weight:500;line-height:1.05;font-variant-numeric:tabular-nums}
.dmon{font-size:13px;color:var(--muted)}
.rel{margin-top:6px;font-size:11px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;background:var(--accent);color:var(--accent-fg);padding:2px 7px;border-radius:3px}
.rel.soft{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.day-items{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));align-content:start;min-width:0}
.day.is-past .item{opacity:.7}
@media (max-width:640px){
  .day{grid-template-columns:minmax(0,1fr);gap:12px;padding:14px}
  .day-head{flex-direction:row;align-items:baseline;gap:8px;flex-wrap:wrap;padding-right:0;border-right:0;padding-bottom:10px;border-bottom:1px solid var(--line)}
  .dnum{font-size:24px}
  .rel{margin-top:0}
}

/* Items */
.item{display:flex;align-items:flex-start;gap:9px;padding:10px 11px;min-width:0;border-radius:var(--radius);
  background:color-mix(in srgb,var(--c) 10%,var(--surface));
  border:1px solid color-mix(in srgb,var(--c) 32%,var(--line))}
.item-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;text-align:left;background:none;border:0;padding:0;cursor:pointer}
.item-cat{display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:650;min-width:0}
.item-cat span.t{overflow-wrap:anywhere}
.dot{width:9px;height:9px;border-radius:2px;background:var(--c);flex:none}
.item-title{font-weight:600;font-size:14.5px;line-height:1.3;overflow-wrap:anywhere}
.item-meta{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.item.done .item-title{text-decoration:line-through;color:var(--muted)}
.flag{color:var(--danger);font-weight:500}
.check{flex:none;width:20px;height:20px;margin-top:1px;border:1.5px solid var(--muted);border-radius:4px;background:var(--surface);display:grid;place-items:center;cursor:pointer;padding:0;color:transparent}
.check[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}

/* Week view */
.week{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.wd{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);min-width:0;display:flex;flex-direction:column;overflow:hidden}
.wd.weekend{background:var(--surface-2)}
.wd-head{display:flex;align-items:baseline;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.wd-head .wdow{font-family:var(--f-display);font-weight:680;font-size:15px}
.wd-head .wnum{font-family:var(--f-mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1}
.wd-head .wmon{font-size:12px;color:var(--muted)}
.wd-head .add{margin-left:auto;align-self:center;width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:5px;cursor:pointer;padding:0}
.wd-head .add:hover{border-color:var(--muted)}
.wd.today .wd-head{background:var(--accent);color:var(--accent-fg);border-bottom-color:var(--accent)}
.wd.today .wd-head .wmon{color:inherit;opacity:.85}
.wd.today .wd-head .add{background:transparent;border-color:color-mix(in srgb,var(--accent-fg) 55%,transparent);color:var(--accent-fg)}
.wd-body{display:flex;flex-direction:column;gap:7px;padding:8px;min-height:64px}
.wd.is-past .item{opacity:.7}
.free{color:var(--muted);font-size:13px;padding:4px 2px}
.wd .item{padding:8px 9px}
@media (min-width:1100px){
  .week{grid-template-columns:repeat(7,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;background:var(--surface)}
  .wd{border:0;border-right:1px solid var(--line);border-radius:0}
  .wd:last-child{border-right:0}
  .wd-head{flex-direction:column;align-items:flex-start;gap:2px;position:relative}
  .wd-head .add{position:absolute;top:10px;right:8px;margin:0}
  .wd-body{min-height:300px}
  .free{display:none}
}

/* Modal */
.overlay{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:100%;max-width:540px;padding:20px;margin-block:auto;min-width:0}
.sheet h2{font-family:var(--f-display);font-size:22px;margin:0;font-weight:700;letter-spacing:-.01em}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.field label,.field .lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:650}
.field .inp,.field .sel,.field textarea{width:100%}
.field textarea{resize:vertical;min-height:70px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.dow-out{font-size:14px;color:var(--accent);font-weight:600;min-height:20px}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.swatches label{cursor:pointer;position:relative}
.swatches input[type="radio"]{position:absolute;opacity:0;pointer-events:none}
.sw{display:block;width:26px;height:26px;border-radius:6px;background:var(--c);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.swatches input:checked + .sw{box-shadow:0 0 0 2px var(--fg)}
.swatches input:focus-visible + .sw{outline:2px solid var(--focus);outline-offset:3px}
button.sw{cursor:pointer;padding:0}
button.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
.custom-color{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.custom-color input{width:30px;height:26px;padding:0;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer}
.err{color:var(--danger);font-size:14px;min-height:20px;margin:0 0 8px}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.actions .left{margin-right:auto}
.sub-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding-block:14px;border-top:1px solid var(--line)}
.sub-row .swatches{grid-column:1 / -1}
.sub-row .sw{width:22px;height:22px}
.hint{color:var(--muted);font-size:13px;margin:0 0 10px}

.foot{margin-top:28px;color:var(--muted);font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:var(--radius);font-size:14px;max-width:calc(100% - 32px)}
/* Sign-in gate and account */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg)}
.gate-wrap{width:100%;max-width:420px;display:flex;flex-direction:column;gap:22px;min-width:0}
.gate-brand{display:flex;align-items:center;gap:12px}
.gate-brand .brand-mark{width:46px;height:46px}
.gate .brand-tag{color:var(--muted)}
.gate-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px}
.g-title{font-family:var(--f-display);font-weight:720;font-size:26px;letter-spacing:-.02em;margin:0 0 6px;line-height:1.15}
.g-sub{margin:0 0 18px;color:var(--muted)}
.g-sub strong{color:var(--fg);overflow-wrap:anywhere}
.g-sub code,.gate code{font-family:var(--f-mono);font-size:13px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.btn.wide{width:100%;min-height:42px;margin-top:8px}
.g-links{display:flex;flex-direction:column;gap:10px;margin-top:18px;font-size:14px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-align:left;text-decoration:underline;text-underline-offset:3px;font-size:inherit}
.check-inline{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin-bottom:10px}
.ok{color:var(--ok);font-size:14px;min-height:20px;margin:0 0 8px}
.set-h{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:20px 0 8px;font-weight:650;border-top:1px solid var(--line);padding-top:14px}
[data-motion="off"] *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--radius);padding:10px 12px;margin:0 0 16px;font-size:14px}
.notice b{font-weight:650}
.gate-foot{margin:0;color:var(--muted);font-size:13px;text-align:center}
.account{margin-top:auto;border-top:1px solid var(--side-line);padding-top:14px;display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--side-muted)}
.account .em{overflow-wrap:anywhere;color:var(--side-fg);font-size:14px}
.side-btn{background:none;border:1px solid var(--side-line);color:var(--side-fg);padding:7px 10px;border-radius:var(--radius);cursor:pointer;font-weight:550;font-size:14px}
.side-btn:hover{background:var(--side-hover)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app" hidden>
  <aside class="side" id="side">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 40 40" role="img" aria-label="Logotipo de Mi Agenda">
        <rect width="40" height="40" rx="10" fill="#2A62AE"/>
        <g transform="translate(0 2)">
          <path d="M9 13C14 11 18 12 20 14V30C18 28 14 27 9 29Z" fill="#FFFFFF"/>
          <path d="M31 13C26 11 22 12 20 14V30C22 28 26 27 31 29Z" fill="#A9CBF7"/>
          <circle cx="20" cy="8" r="2.2" fill="#FFFFFF"/>
        </g>
      </svg>
      <div><span class="brand-name">Mi Agenda</span><span class="brand-tag">Tu agenda escolar</span></div>
    </div>
    <button class="btn primary add-btn" data-act="add" id="add-btn"></button>
    <nav class="only-wide" aria-label="Vistas"><p class="rail-title">Vistas</p><div class="nav" id="nav"></div></nav>
    <section class="only-wide" aria-label="Resumen"><p class="rail-title">Resumen</p><div class="sum" id="summary"></div></section>
    <section class="only-wide" aria-label="Materias"><p class="rail-title">Materias<button type="button" data-act="subjects">Gestionar</button></p><div class="legend" id="legend"></div></section>
    <div class="account only-wide"><span>Sesión iniciada como</span><span class="em" id="acc-email"></span><button type="button" class="side-btn" data-act="prefs">Ajustes</button><button type="button" class="side-btn" data-act="logout">Cerrar sesión</button></div>
  </aside>
  <div class="main">
    <header class="page-head"><p class="eyebrow" id="eyebrow"></p><h1 id="page-title"></h1></header>
    <div class="toolbar" id="bar"></div>
    <main id="content"></main>
    <footer class="foot" id="storage"></footer>
  </div>
</div>
<div class="gate" id="gate"></div>
<div class="overlay" id="modal" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
'use strict';

/* ---------- Constants ---------- */

/* ---------- Date helpers (local time, week starts on Monday) ---------- */
const p2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12);};
const dow=d=>(d.getDay()+6)%7;
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n,12);
const startOfWeek=d=>addDays(d,-dow(d));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const todayStr=()=>ymd(new Date());
function isoWeek(d){
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=(t.getUTCDay()+6)%7; t.setUTCDate(t.getUTCDate()-day+3);
  const fy=new Date(Date.UTC(t.getUTCFullYear(),0,4));
  return 1+Math.round(((t-fy)/864e5-3+((fy.getUTCDay()+6)%7))/7);
}
const longDate=d=>DOW[dow(d)]+', '+d.getDate()+' de '+MON[d.getMonth()]+' de '+d.getFullYear();
function rangeLabel(a,b){
  if(a.getFullYear()!==b.getFullYear()) return a.getDate()+' '+MONS[a.getMonth()]+' '+a.getFullYear()+' – '+b.getDate()+' '+MONS[b.getMonth()]+' '+b.getFullYear();
  if(a.getMonth()!==b.getMonth()) return a.getDate()+' '+MONS[a.getMonth()]+' – '+b.getDate()+' '+MONS[b.getMonth()]+' '+b.getFullYear();
  return a.getDate()+' – '+b.getDate()+' '+MONS[b.getMonth()]+' '+b.getFullYear();
}
const diffDays=(a,b)=>Math.round((parse(a)-parse(b))/864e5);

  if(v==='verify') cooldown();

function setBusy(b){busy=b;const sb=document.querySelector('#auth-form button[type="submit"]');if(sb)sb.disabled=b;}
async function authSubmit(form){
  if(busy||!auth) return;
  const mode=form.dataset.mode, email=($('#a-email').value||'').trim(), pass=($('#a-pass')||{}).value||'';
  const err=function(t){msg('#a-err',t);};
  err(''); msg('#a-ok','');
  if(!/^\S+@\S+\.\S+$/.test(email)) return err('Escribe un correo válido.');
  if(mode==='login'&&!pass) return err('Escribe tu contraseña.');
  if(mode==='register'){
    if(pass.length<8) return err('La contraseña debe tener al menos 8 caracteres.');
    if(pass!==$('#a-pass2').value) return err('Las contraseñas no coinciden.');
  }
  setBusy(true);
  try{
    if(mode==='login'){ await FA.signInWithEmailAndPassword(auth,email,pass); }
    else if(mode==='register'){
      const cred=await FA.createUserWithEmailAndPassword(auth,email,pass);
      try{ await FA.sendEmailVerification(cred.user); verifySent=true; markSent(); }catch(e){ verifySent=false; }
      if(gateView==='verify') setGate('verify');
    }
    else if(mode==='reset'){
      await FA.sendPasswordResetEmail(auth,email);
      msg('#a-ok','Si existe una cuenta con ese correo, recibirás un enlace para crear una contraseña nueva.');
    }
  }catch(e){ err(authMsg(e)); }
  finally{ setBusy(false); }
}
const CD_KEY='miagenda_verif_sent';
function markSent(){try{localStorage.setItem(CD_KEY,String(Date.now()));}catch(e){}}
function cdLeft(){let t=0;try{t=Number(localStorage.getItem(CD_KEY))||0;}catch(e){}return Math.max(0,60-Math.floor((Date.now()-t)/1000));}
function cooldown(){
  clearInterval(resendT);
  const paint=function(){
    const b=$('#resend'); if(!b){clearInterval(resendT);return;}
    const n=cdLeft();
    if(n<=0){clearInterval(resendT);b.disabled=false;b.textContent='Reenviar correo';}
    else{b.disabled=true;b.textContent='Reenviar correo ('+n+' s)';}
  };
  paint(); resendT=setInterval(paint,1000);
}
async function resendVerification(){
  const u=auth&&auth.currentUser; if(!u) return;
  try{ if(cdLeft()>0) return; await FA.sendEmailVerification(u); verifySent=true; markSent(); msg('#a-err',''); msg('#a-ok','Correo reenviado. Revisa también la carpeta de spam.'); cooldown(); }
  catch(e){ msg('#a-ok',''); msg('#a-err',authMsg(e)); }
}
async function checkVerified(manual){
  const u=auth&&auth.currentUser; if(!u) return;
  try{
    await u.reload();
    if(u.emailVerified){ await u.getIdToken(true); enterApp(u); }
    else if(manual){ msg('#a-ok',''); msg('#a-err','Todavía no aparece como verificado. Abre el enlace del correo y vuelve a intentarlo.'); }
  }catch(e){ if(manual) msg('#a-err',authMsg(e)); }
}
function startPoll(){stopPoll();pollT=setInterval(function(){checkVerified(false);},5000);}
function stopPoll(){clearInterval(pollT);pollT=null;}
function enterApp(u){
  stopPoll();
  if(entered===u.uid&&!$('#app').hidden) return;
  entered=u.uid; S.user=u; S.loaded=false;
  $('#gate').hidden=true; $('#app').hidden=false;
  render(); attach(u.uid);
}
async function boot(){
  if(!FIREBASE_CONFIG.apiKey||!FIREBASE_CONFIG.projectId){setGate('config');return;}
  if(!/^https?:$/.test(location.protocol)){setGate('protocol');return;}
  setGate('loading');
  try{
    const base='https://www.gstatic.com/firebasejs/'+FB_VER+'/';
    const mods=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
    const app=mods[0].initializeApp(FIREBASE_CONFIG); FA=mods[1]; FS=mods[2];
    auth=FA.getAuth(app); auth.languageCode='es';
    try{ db=FS.initializeFirestore(app,{localCache:FS.persistentLocalCache({tabManager:FS.persistentMultipleTabManager()})}); }
    catch(e){ db=FS.getFirestore(app); }
  }catch(e){ console.error(e); setGate('neterr'); return; }
  FA.onAuthStateChanged(auth,function(user){
    stopPoll(); clearInterval(resendT);
    if(!user){
      detach(); closeModal(); entered=null; verifySent=false;
      S.user=null; S.items=[]; S.subjects=[]; S.loaded=false;
      setGate('login'); return;
    }
    if(!user.emailVerified){ detach(); entered=null; S.user=user; setGate('verify'); startPoll(); return; }
    enterApp(user);
  });
}

/* ---------- Queries ---------- */
const subjOf=(it,list)=>list.find(s=>s.id===it.subject)||null;
const cmp=(a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.time||'')<(b.time||'')?-1:(a.time||'')>(b.time||'')?1:a.title.localeCompare(b.title,'es');
function filtered(useRange){
  let a=S.items.slice();
  if(S.fcat) a=a.filter(i=>i.cat===S.fcat);
  if(S.fsubj) a=a.filter(i=>i.subject===S.fsubj);
  if(useRange){
    if(S.range==='past') a=a.filter(i=>i.date<S.today);
    else if(S.range==='today') a=a.filter(i=>i.date===S.today);
    else if(S.range==='future') a=a.filter(i=>i.date>S.today);
  }
  return a.sort(cmp);
}

/* ---------- Rendering ---------- */
function relTag(date){
  const n=diffDays(date,S.today);
  if(n===0) return '<span class="rel">Hoy</span>';
  if(n===1) return '<span class="rel soft">Mañana</span>';
  if(n===-1) return '<span class="rel soft">Ayer</span>';
  return '';
}
function card(it,D){
  const c=CATM[it.cat]||CATM.otro, sub=subjOf(it,D.subjects);
  const color=sub?sub.color:c.color;
  const meta=[];
  if(it.time) meta.push(esc(it.time));
  if(it.cat==='examen'&&it.grade!=null) meta.push('Nota '+Number(it.grade).toLocaleString('es-ES',{maximumFractionDigits:2}));
  else if(it.cat==='examen'&&it.date<S.today) meta.push('Nota pendiente');
  if(c.todo&&!it.done&&it.date<S.today) meta.push('<span class="flag">Vencido</span>');
  const label=esc(c.name)+(sub?' · '+esc(sub.name):'');
  const chk=c.todo?'<button class="check" data-act="toggle" data-id="'+esc(it.id)+'" aria-pressed="'+(it.done?'true':'false')+'" aria-label="Marcar como hecho">'+ICON.check+'</button>':'';
  return '<div class="item'+(it.done?' done':'')+'" style="--c:'+esc(color)+'">'+chk+
    '<button class="item-main" data-act="edit" data-id="'+esc(it.id)+'">'+
    '<span class="item-cat"><i class="dot"></i><span class="t">'+label+'</span></span>'+
    '<span class="item-title">'+esc(it.title)+'</span>'+
    (meta.length?'<span class="item-meta">'+meta.join(' · ')+'</span>':'')+
    '</button></div>';
}
function groupHTML(arr,D){
  const by=[]; let cur=null;
  arr.forEach(i=>{if(!cur||cur.date!==i.date){cur={date:i.date,list:[]};by.push(cur);}cur.list.push(i);});
  return by.map(g=>{
    const d=parse(g.date), past=g.date<S.today;
    return '<section class="day'+(past?' is-past':'')+(g.date===S.today?' is-today':'')+'">'+
      '<header class="day-head"><span class="dow">'+cap(DOW[dow(d)])+'</span><span class="dnum">'+d.getDate()+'</span><span class="dmon">'+MON[d.getMonth()]+' '+d.getFullYear()+'</span>'+relTag(g.date)+'</header>'+
      '<div class="day-items">'+g.list.map(i=>card(i,D)).join('')+'</div></section>';
  }).join('');
}
function emptyHTML(){
  const filt=S.fcat||S.fsubj;
  if(filt) return '<div class="empty"><strong>Sin resultados</strong>Prueba a quitar algún filtro.</div>';
  const m={past:['Nada en el pasado','No hay registros anteriores a hoy.'],
    today:['Hoy no hay nada','Apunta algo para hoy cuando lo necesites.'],
    future:['Nada próximo','No hay registros posteriores a hoy.'],
    all:['La agenda está vacía','Crea el primer registro: un examen, unos deberes o un evento.']}[S.range];
  return '<div class="empty"><strong>'+m[0]+'</strong>'+m[1]+'<button class="btn primary" data-act="add">'+ICON.plus+'Añadir registro</button></div>';
}
function listHTML(){
  const D=data(); let out='';
  const arr=filtered(true);
  if(!arr.length) return emptyHTML();
  let past=[],rest=arr;
  if(S.range==='all'){past=arr.filter(i=>i.date<S.today);rest=arr.filter(i=>i.date>=S.today);}
  if(past.length){
    out+='<button class="btn past-toggle" data-act="showpast">'+(S.showPast?'Ocultar los '+past.length+' anteriores':'Mostrar '+past.length+(past.length===1?' anterior':' anteriores'))+'</button>';
    if(S.showPast) out+=groupHTML(past,D);
  }
  if(!rest.length&&S.range==='all') out+='<p class="inline-empty">No hay nada programado desde hoy.</p>';
  out+=groupHTML(rest,D);
  return out;
}
function weekHTML(){
  const D=data(), start=S.weekStart, days=[0,1,2,3,4,5,6].map(i=>addDays(start,i));
  const arr=filtered(false), curYear=parse(S.today).getFullYear();
  return '<div class="week">'+days.map((d,i)=>{
    const s=ymd(d), list=arr.filter(x=>x.date===s);
    return '<section class="wd'+(s===S.today?' today':'')+(s<S.today?' is-past':'')+(i>=5?' weekend':'')+'" aria-label="'+esc(longDate(d))+'">'+
      '<header class="wd-head"><span class="wdow">'+DOWS[i]+'</span><span class="wnum">'+d.getDate()+'</span><span class="wmon">'+MONS[d.getMonth()]+(d.getFullYear()!==curYear?' '+d.getFullYear():'')+'</span>'+
      '<button class="add" data-act="add" data-date="'+s+'" aria-label="Añadir el '+esc(longDate(d))+'">'+ICON.plus+'</button></header>'+
      '<div class="wd-body">'+(list.length?list.map(x=>card(x,D)).join(''):'<span class="free">Sin registros</span>')+'</div></section>';
  }).join('')+'</div>';
}

function sideHTML(){

function render(){
  const t=parse(S.today);
  if(S.view==='list'){
    $('#eyebrow').textContent='Hoy · '+cap(longDate(t));
    $('#page-title').textContent={all:'Todos los registros',past:'Registros pasados',today:'Hoy',future:'Registros futuros'}[S.range];
  }else{
    const e=addDays(S.weekStart,6), n=S.items.filter(i=>i.date>=ymd(S.weekStart)&&i.date<=ymd(e)).length;
    $('#eyebrow').textContent='Semana '+isoWeek(S.weekStart)+' · '+n+(n===1?' registro':' registros');
    $('#page-title').textContent=rangeLabel(S.weekStart,e);
  }
  const ae=document.activeElement, keep=ae&&ae.id;
  $('#bar').innerHTML=barHTML();
  $('#content').innerHTML=!S.loaded?'<div class="empty"><strong>Cargando tu agenda</strong>Un momento.</div>':(S.view==='list'?listHTML():weekHTML());
  sideHTML(); renderStorage();

}
function swatchRadios(name,selected){

    '<label class="custom-color">Otro<input type="color" id="f-custom" value="'+selected+'" aria-label="Color personalizado"></label></div>';

function syncForm(){
  const c=CATM[$('#f-cat').value]||CATM.otro;
  $('#f-subj-box').hidden=!c.subj;
  $('#f-grade-box').hidden=!c.grade;
  const sel=$('#f-subj'); $('#f-new-box').hidden=!(c.subj&&sel&&sel.value==='__new');
  $('#f-title').placeholder=c.ph;
  const dv=$('#f-date').value;
  $('#f-dow').textContent=dv?cap(longDate(parse(dv))):'Elige una fecha';
}
async function submitForm(){
  const c=CATM[$('#f-cat').value]||CATM.otro;
  const title=$('#f-title').value.trim(), date=$('#f-date').value, time=$('#f-time').value, notes=$('#f-notes').value.trim();
  const err=m=>{$('#f-err').textContent=m;};
  if(!title) return err('Escribe un título.');
  if(!date) return err('Elige una fecha.');
  let subject='', newSub=null;
  if(c.subj){
    const sel=$('#f-subj').value;
    if(sel==='__new'){
      const name=$('#f-newname').value.trim();
      if(!name) return err('Escribe el nombre de la nueva materia.');
      const ex=S.subjects.find(s=>s.name.toLowerCase()===name.toLowerCase());
      if(ex) subject=ex.id;
      else{
        const cu=$('#f-custom'), ch=document.querySelector('input[name="f-color"]:checked');
        const color=(cu&&cu.dataset.used==='1')?cu.value:(ch?ch.value:nextColor());
        newSub={id:uid(),name:name,color:color}; subject=newSub.id;
      }
    }else if(!sel) return err('Elige una materia o crea una nueva.');
    else subject=sel;
  }
  let grade=null;
  if(c.grade){
    const raw=$('#f-grade').value.trim().replace(',','.');
    if(raw!==''){const n=Number(raw);if(!isFinite(n)||n<0||n>10) return err('La nota debe estar entre 0 y 10.');grade=n;}
  }
  const old=S.modal.id?S.items.find(i=>i.id===S.modal.id):null;
  let remindAt=null;
  if($('#f-rem').checked){
    const r=$('#f-remat').value; remindAt=r?new Date(r).getTime():NaN;
    if(isNaN(remindAt)) return err('Elige la fecha y la hora del aviso.');
    if((!old||old.remindAt!==remindAt)&&remindAt<=Date.now()) return err('La hora del aviso ya ha pasado.');
  }
  const reminded=!!(old&&old.remindAt===remindAt&&old.reminded);
  const item={id:old?old.id:uid(),cat:c.id,title:title,date:date,time:time,subject:subject,grade:grade,notes:notes,remindAt:remindAt,reminded:reminded,done:old?!!old.done:false,created:old?old.created:Date.now()};
  if(newSub) S.subjects.push(newSub);
  if(old) S.items[S.items.indexOf(old)]=item; else S.items.push(item);
  closeModal(); render();
  if(newSub) persist('s',newSub);
  persist('i',item);
}

function applyPrefs(P){
  P=P||{}; const r=document.documentElement;
  if(P.theme==='light'||P.theme==='dark') r.dataset.theme=P.theme; else delete r.dataset.theme;
  r.style.zoom=({m:'1.12',l:'1.25'})[P.fs]||'';
  r.dataset.motion=P.motion?'off':'';
  const dark=P.theme==='dark'||(P.theme!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches), a=ACC[P.accent];
  ['--accent','--accent-fg','--accent-soft'].forEach(k=>r.style.removeProperty(k));
  if(a){const c=dark?a[1]:a[0];r.style.setProperty('--accent',c);r.style.setProperty('--accent-fg',dark?'#0A1522':'#FFFFFF');r.style.setProperty('--accent-soft','color-mix(in srgb,'+c+' 14%,transparent)');}
  try{localStorage.setItem('ma_ui',JSON.stringify(P));}catch(e){}
}
try{applyPrefs(JSON.parse(localStorage.getItem('ma_ui')||'{}'));}catch(e){}

async function delAcct(){
  const e=$('#s-err'), pw=$('#s-delpw').value;
  if(!pw){e.textContent='Escribe tu contraseña actual.';return;}
  if(!S.delAcct){S.delAcct=true;e.textContent='Pulsa otra vez para borrar todo. No se puede deshacer.';return;}
  try{
    const u=auth.currentUser;
    await FA.reauthenticateWithCredential(u,FA.EmailAuthProvider.credential(u.email,pw));
    S.deleting=true;
    for(const n of ['items','subjects']){const q=await FS.getDocs(FS.collection(db,'users',u.uid,n));for(const d of q.docs)await FS.deleteDoc(d.ref);}
    await FS.deleteDoc(prefRef()); await FA.deleteUser(u); closeModal();
  }catch(x){S.deleting=false;S.delAcct=false;e.textContent=(x.code==='auth/wrong-password'||x.code==='auth/invalid-credential')?'Contraseña incorrecta.':'No se pudo eliminar. Inténtalo de nuevo.';}
}

/* ---------- Events ---------- */
document.addEventListener('click',function(e){
  if(e.target.id==='modal'){closeModal();return;}
  const t=e.target.closest('[data-act]'); if(!t) return;
  const a=t.dataset.act;
  if(a==='logout'){if(FA&&auth)FA.signOut(auth);return;}
  if(a==='g-login'){setGate('login');return;}
  if(a==='g-register'){setGate('register');return;}
  if(a==='g-reset'){setGate('reset');return;}
  if(a==='g-check'){checkVerified(true);return;}
  if(a==='g-resend'){resendVerification();return;}
  if(a==='g-reload'){location.reload();return;}
  if(a==='view'){S.view=t.dataset.v;render();}
  else if(a==='range'){S.range=t.dataset.r;render();}
  else if(a==='showpast'){S.showPast=!S.showPast;render();}
  else if(a==='prev'){S.weekStart=addDays(S.weekStart,-7);render();}
  else if(a==='next'){S.weekStart=addDays(S.weekStart,7);render();}
  else if(a==='thisweek'){S.weekStart=startOfWeek(parse(S.today));render();}
  else if(a==='add'){openForm(null,t.dataset.date||null);}
  else if(a==='edit'){openForm(t.dataset.id);}
  else if(a==='fsubj'){S.fsubj=S.fsubj===t.dataset.id?'':t.dataset.id;render();}
  else if(a==='toggle'){
    const it=S.items.find(i=>i.id===t.dataset.id); if(!it) return;
    it.done=!it.done; render(); persist('i',it);
  }
  else if(a==='prefs'){openPrefs();}
  else if(a==='pwreset'){FA.sendPasswordResetEmail(auth,S.user.email).then(function(){toast('Enlace enviado a tu correo. Revisa también el spam.');}).catch(function(){toast('No se pudo enviar el enlace.');});}
  else if(a==='export'){exportData();}
  else if(a==='delacct'){delAcct();}
  else if(a==='subjects'){openSubjects();}
  else if(a==='close'){closeModal();}
  else if(a==='delete'){
    if(!S.delArmed){S.delArmed=true;t.textContent='Confirmar eliminación';return;}
    const id=S.modal&&S.modal.id; closeModal();
    const i=S.items.findIndex(x=>x.id===id); if(i<0) return;
    S.items.splice(i,1); render(); unpersist('i',id);
  }
  else if(a==='subcolor'){
    const s=S.subjects.find(x=>x.id===t.dataset.id); if(!s) return;
    s.color=t.dataset.color; renderSubjects(); render(); persist('s',s);
  }
  else if(a==='delsub'){
    const id=t.dataset.id;
    if(S.items.some(i=>i.subject===id)) return;
    S.subjects=S.subjects.filter(s=>s.id!==id);
    if(S.fsubj===id) S.fsubj='';
    renderSubjects(); render(); unpersist('s',id);
  }
});
document.addEventListener('change',function(e){
  const t=e.target;
  if(t.dataset&&t.dataset.pref){
    const k=t.dataset.pref, v=t.type==='checkbox'?t.checked:(t.dataset.num?Number(t.value):t.value);
    S.prefs=Object.assign({},S.prefs,{[k]:v}); applyPrefs(S.prefs);
    if(k==='showPast'){S.showPast=v;render();}
    FS.setDoc(prefRef(),{[k]:v,tz:PREF0().tz},{merge:true}).catch(fsError); return;
  }
  if(t.id==='a-show'){['a-pass','a-pass2'].forEach(function(id){const n=document.getElementById(id);if(n)n.type=t.checked?'text':'password';});}
  else if(t.id==='f-rem'){$('#f-rem-box').hidden=!t.checked;const r=$('#f-remat');if(t.checked&&!r.value)r.value=($('#f-date').value||S.today)+'T'+($('#f-time').value||(S.prefs&&S.prefs.remTime)||'08:00');}
  else if(t.id==='fcat'){S.fcat=t.value;render();}
  else if(t.id==='fsubj'){S.fsubj=t.value;render();}
  else if(t.id==='jump'){if(t.value){S.weekStart=startOfWeek(parse(t.value));render();}}
  else if(t.id==='f-cat'||t.id==='f-subj') syncForm();
  else if(t.name==='f-color'){const cu=$('#f-custom');if(cu)cu.dataset.used='';}
  else if(t.classList&&t.classList.contains('sub-custom')){
    const s=S.subjects.find(x=>x.id===t.dataset.id); if(!s) return;
    s.color=t.value; renderSubjects(); render(); persist('s',s);
  }
  else if(t.classList&&t.classList.contains('sub-name')){
    const s=S.subjects.find(x=>x.id===t.dataset.id); const n=t.value.trim();
    if(!s) return;
    if(!n){t.value=s.name;return;}
    s.name=n; render(); persist('s',s);
  }
});
document.addEventListener('input',function(e){
  const t=e.target;
  if(t.id==='f-date') syncForm();
  else if(t.id==='f-custom'){t.dataset.used='1';document.querySelectorAll('input[name="f-color"]').forEach(r=>{r.checked=false;});}
});
document.addEventListener('submit',function(e){
  if(e.target.id==='form'){e.preventDefault();submitForm();}
  else if(e.target.id==='auth-form'){e.preventDefault();authSubmit(e.target);}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.modal) closeModal();});
function tick(){const t=todayStr();if(t!==S.today){const wasCurrent=ymd(S.weekStart)===ymd(startOfWeek(parse(S.today)));S.today=t;if(wasCurrent)S.weekStart=startOfWeek(parse(t));render();}}
document.addEventListener('visibilitychange',tick);
setInterval(tick,60000);

/* ---------- Start ---------- */
render(); boot();
})();
</script>
</body>
</html>
